# Diagnostic temporaire : contenu de la zone fttt.pf vue par un serveur GitHub (à supprimer ensuite)
name: diag-dns
on:
  push:
    paths: ['.github/workflows/diag-dns.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Zone
        run: |
          sudo apt-get -qq update >/dev/null 2>&1; sudo apt-get -qq install -y dnsutils >/dev/null 2>&1
          n() { echo "::notice title=$1::$(echo "$2" | tr '\n' ' ' | sed 's/  */ /g' | cut -c1-900)"; }
          S=nsa.n0c.com
          for name in app.fttt.pf _github-pages-challenge-ftttalize-debug.app.fttt.pf fttt.pf www.fttt.pf _dmarc.fttt.pf default._domainkey.fttt.pf brevo1._domainkey.fttt.pf brevo2._domainkey.fttt.pf mail.fttt.pf _acme-challenge.fttt.pf; do
            for t in A AAAA CNAME TXT MX NS CAA; do
              r=$(dig +time=5 +tries=2 +norec +short $name $t @$S 2>&1)
              [ -n "$r" ] && n "$name $t" "$r"
            done
          done
          n "fin" "termine"
