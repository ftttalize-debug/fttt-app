# Diagnostic temporaire (relance 2) : ce que voit un serveur GitHub pour app.fttt.pf (à supprimer ensuite)
name: diag-dns
on:
  push:
    paths: ['.github/workflows/diag-dns.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get -qq update >/dev/null 2>&1; sudo apt-get -qq install -y dnsutils >/dev/null 2>&1
          n() { echo "::notice title=$1::$(echo "$2" | tr '\n' ' ' | sed 's/  */ /g' | cut -c1-900)"; }
          n "nsc" "$(dig +time=5 +tries=2 +norec app.fttt.pf CNAME @nsc.n0c.com 2>&1 | grep -E 'status:|IN\s+CNAME|timed out')"
          n "planethoster" "$(for s in nsa.planethoster.net nsb.planethoster.net; do dig +time=5 +tries=1 +norec app.fttt.pf CNAME @$s 2>&1 | grep -E 'status:|IN\s+(CNAME|SOA)|timed out|no servers'; done)"
          n "api pages" "$(gh api repos/${{ github.repository }}/pages 2>&1 | head -c 800)"
          n "api health" "$(gh api repos/${{ github.repository }}/pages/health 2>&1 | head -c 800)"
